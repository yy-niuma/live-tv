name: Update IPTV Playlists

# ---------------------------------------------------------------------------
# 触发面与「防环」设计（改动前只有 schedule / workflow_dispatch / pull_request）
#
# 本轮加了 push（main 分支）。为什么必须小心：本 workflow 的 update job 最后一步就是
# `git push origin HEAD:main`，如果 push 又能触发本 workflow，理论上就是无限循环。
# 两道锁，任何一道单独成立就足够：
#
#   锁 1（GitHub 平台层，事实而非设计）：GITHUB_TOKEN 发起的 push **不会**产生新的
#        workflow run —— 这是 GitHub 的 anti-recursion 规则。update job 用的就是
#        默认的 GITHUB_TOKEN（actions/checkout 的 persist-credentials），所以它自己
#        的推送永远不会自触发。这条不能拿来当唯一保障，因为改天谁把 push 换成 PAT
#        就会失效。
#
#   锁 2（本文件，显式 allowlist）：update job 的 `if` 是**正面列举**
#        `schedule || workflow_dispatch`，而不是「排除 pull_request」。
#        正面列举是 fail-closed：以后再加 release / repository_dispatch 等触发面，
#        update 也不会顺手跟着跑生产。push 事件下拉起本 workflow 时，只有 check
#        （只读：ruff / mypy / pytest）会跑，`.github/workflows/update.yml` 里
#        没有任何一条写仓库的步骤会因为 push 事件被执行。
#
#   锁 2b：check job 额外挡掉 `github.actor == 'github-actions[bot]'`。
#        万一推送改用 PAT（PAT 推送真的会产生 push 事件），bot 自己的产物提交
#        也不该再跑一遍只读检查 —— 那是纯烧额度。
#
# 想验证防环没被改坏：tests/test_ci_workflow.py::test_update_job_never_runs_on_push
# ---------------------------------------------------------------------------

on:
  # 每天北京时间 8:00（UTC 0:00）
  schedule:
    - cron: "0 0 * * *"
  # 手动触发（可传参数）
  workflow_dispatch:
    inputs:
      fetch_timeout:
        description: "抓取超时秒数"
        required: false
        default: "300"
        type: string
      skip_validation:
        description: "跳过 URL 验证"
        required: false
        default: "false"
        type: string
      validate_concurrency:
        description: "验证阶段并发数（默认 80；调高可能被源站限流）"
        required: false
        default: "80"
        type: string
      validate_timeout:
        description: "验证阶段单条超时秒数（默认 10；调低会判死慢链路）"
        required: false
        default: "10"
        type: string
      shard_count:
        description: "验证分片数（默认 8；1 = 不分片，单 job 内验证；上限 16）"
        required: false
        default: "8"
        type: string
  # PR 门禁：只跑 check job，update job 用 job 级 if 挡掉（见文件头 + docs/ci.md §1）
  pull_request:
  # 主干 push：只跑只读的 check；生产 update 被 job 级 allowlist 挡住（见文件头锁 2）
  push:
    branches:
      - main

# 同一 ref 上的跑批串行化。cancel-in-progress 必须是 false：
# update job 会 git push，半路取消会留下"提交了但 artifact 没上传"的半截运行，
# 而每日定时任务本来就只是排队，不需要抢占。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  FETCH_TIMEOUT: ${{ inputs.fetch_timeout || '300' }}
  # 验证阶段并发（2026-11-01 重新实测）。
  #
  # 为什么改：CI 实测「抓取数据」这一步占 18 分钟里的 17.8 分钟，
  # 其中**验证阶段 1070 秒**是绝对大头（抓取只要 9.9 秒）。
  # 验证是纯网络等待（4 vCPU runner 上 CPU 不是瓶颈），
  # 所以并发就是唯一的提速杠杆：并发翻倍 → 耗时减半。
  #
  # 为什么不是 60：旧文档记着「并发 60 会掉条」（300 条样本 236~296 波动），
  # 但那是**每 URL 新建 session** 的旧实现测的 —— 那时每次请求都新开一条
  # TCP 连接，源站看到的是一堆短命连接，容易触发限流。
  # 改成批次级 session（连接池复用）后重新实测（200 条真实 URL × 2 轮）：
  #     并发  20   40   60   80  100  150
  #     可用 184  184  183  184  184  184   ← 全档位持平，不掉条
  # 复现命令：scripts/bench_concurrency.py --jobs 20,40,60,80,100,150
  # 更大规模的复核见 docs/ci.md §7。
  #
  # 80 是「不丢条前提下最快」的档位，且留了余量（实测最快点 8.1s，
  # 100/150 档反而变慢 —— 连接打满后排队）。
  VALIDATE_CONCURRENCY: ${{ inputs.validate_concurrency || '80' }}
  # 单条超时保持 10s：调低会把「慢但仍可用」的链路判死
  # （实测 8s/5s 会掉条），属于偷偷降低验证口径，不做。
  VALIDATE_TIMEOUT: ${{ inputs.validate_timeout || '10' }}

jobs:
  # ---------------------------------------------------------------------------
  # 计划：动态生成分片矩阵
  #
  # 为什么需要它：GitHub Actions 的 **job 级 if 不能引用 `matrix` 上下文**
  # （job 级 if 在矩阵展开之前求值）。所以「本片序号 < shard_count」这个
  # 条件没法写在 job 级，只能靠**动态矩阵**来控制实际启动几个 job。
  #
  # 早先版本把矩阵写死 8 片、用 step 级 if 跳过超出的片，结果：
  #   - 超出的片照样**启动 runner**、跑完 checkout + 装依赖才跳过（浪费）
  #   - 16 片配置下 8 号以上没有 artifact，合并步骤直接失败（run #219 实测）
  #
  # 动态矩阵让「实际启动几个 job」精确等于 shard_count，超出的**根本不创建**。
  # ---------------------------------------------------------------------------
  plan:
    name: 生成分片矩阵
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.gen.outputs.shards }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 计算分片列表
        id: gen
        run: |
          # 让脚本**直接写 GITHUB_OUTPUT**（--github-output）——
          # 不要在 shell 里 grep/cut 加工，那会把 `count=16` 削成 `16`，
          # 丢掉 output 的名字，GitHub 报「Invalid format '16'」（run #226 实测）
          python scripts/plan_shards.py \
            --count "${{ github.event.inputs.shard_count || '8' }}" \
            --out shards.json \
            --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 分片验证（矩阵）：把 19,547 条 URL 切成 N 份，N 个 runner 并行验
  #
  # 为什么需要分片（2026-11-01 实测数据）：
  #   run #211（单 job，并发 80，自适应 per-host）验证阶段 717.2s，
  #   已经压到「19,547 条 ÷ 80 并发 × 单条约 2.9s」的理论下限附近。
  #   继续调并发的路已经走到头：本地实测 160/240 档开始掉条（源站限流）。
  #   **唯一还能线性压缩 wall clock 的就是多 runner 并行。**
  #
  # 分片规则见 scripts/validate_shard.py：按 sha1(url) % N 切，
  # 稳定（同 URL 永远同片）且均衡（轮转切片会把热 host 挤在少数片里）。
  #
  # 每片只上传「已验证有效 URL 列表」这一个 JSON，不传 stream_health 快照 ——
  # 熔断冻结期 min(24h, 60×2^bad) 对 3 连败也才 8 分钟，远小于跑批间隔，
  # 快照在 CI 场景里几乎不生效，传它只会让 N 个 job 抢同一个文件。
  # ---------------------------------------------------------------------------
  shard:
    name: 分片验证 shard ${{ matrix.shard }}
    needs: plan
    # shard_count=1 时不分片：整个 shard job 跳过，update 走「单 job 内验证」
    if: |
      always() && needs.plan.result == 'success' &&
      fromJSON(needs.plan.outputs.count) > 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      # 一片失败不能取消其他片：重跑时要能看到完整的分片健康状况
      fail-fast: false
      matrix:
        # 动态矩阵：实际长度 = shard_count，所以超出范围的片**不会被创建**
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 验证本片
        run: |
          python -u scripts/validate_shard.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ needs.plan.outputs.count }} \
            --validate-concurrency ${{ env.VALIDATE_CONCURRENCY }} \
            --validate-timeout ${{ env.VALIDATE_TIMEOUT }} \
            --fetch-timeout ${{ env.FETCH_TIMEOUT }} \
            --out-dir ./shard-${{ matrix.shard }}

      - name: 上传分片结果
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}/valid.json
          retention-days: 1
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 门禁：静态检查（阻断）+ 类型检查（提示）+ 测试（阻断）
  # ---------------------------------------------------------------------------
  check:
    name: 静态检查 → 类型 → 测试
    # 防环第二道锁（见文件头「锁 2b」）：**只在 push 事件上**挡掉 bot 自己推的产物提交。
    # 不写成无条件的 `github.actor != 'github-actions[bot]'`：scheduled run 的 actor
    # 由 GitHub 解析（可能是最后改 cron 的人），不该让这个取值影响每日检查跑不跑。
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只读：check 从不写仓库。权限只给必需的，不放全局（docs/ci.md §2）
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # 缓存键来自 requirements*.txt 的哈希，锁定文件变了就换缓存
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: 安装依赖（运行时 + 开发）
        # 两个文件都装：tests/ 会 import src/，而 src/ 依赖 aiohttp / yaml
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff（阻断门禁）
        # 配置在 pyproject.toml：select = E,F,W,I / line-length 88 / py311
        # per-file-ignores 是逐文件记账的临时豁免，清账计划见 docs/ci.md §6
        run: |
          ruff --version
          ruff check src/ scripts/

      - name: mypy（提示，不阻断）
        # continue-on-error 是刻意决定，不是偷懒：
        # 现网 18 个类型错误全部要改 src/ 才能修，而本 lane 不许改 src/。
        # 修完这些错误、把 src/ 纳入可改范围后，删掉下面这行即可变门禁（docs/ci.md §4）
        continue-on-error: true
        run: |
          mypy --version
          mypy src/

      - name: pytest（阻断门禁）
        # 唯一 runner：不走 -x / --maxfail，要看到全量失败分布
        run: pytest tests/ -q

  # ---------------------------------------------------------------------------
  # 生产：抓取 → 验证 → 生成 → 保险丝 → 可播性门禁 → 推送
  # ---------------------------------------------------------------------------
  update:
    name: 抓取 → 验证 → 生成 → 门禁 → 推送
    # 依赖 shard（分片验证）。shard 被跳过时（shard_count=1）本 job 仍要跑，
    # 所以用 always() + 结果白名单，而不是裸 needs（裸 needs 遇 skipped 会一起跳）。
    needs: [plan, shard]
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.plan.result == 'success' &&
      (needs.shard.result == 'success' || needs.shard.result == 'skipped')
    runs-on: ubuntu-latest
    # 45 → 90 分钟（2026-11-01）。
    #
    # 实测耗时构成（run 41277155230）：
    #     安装依赖   4s
    #     抓取       9.9s
    #     验证       1070s  ← 99% 的时间在这里
    #     门禁+推送  5s
    #     总计       18 分钟
    # 验证并发提到 80 后预计降到 ~9-10 分钟，45 分钟已有 4 倍余量；
    # 放宽到 90 是为了「某天源站集体变慢 / 大量超时」时不至于被杀 ——
    # job 被 timeout 杀掉 = 当天的产物不更新（不是慢，是没有）。
    # 公开仓库 Actions 分钟数无限额，放宽 timeout 不花配额。
    timeout-minutes: 90
    # 提交产物需要写权限；作用域只到本 job，不放宽全局默认
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 下载分片验证结果
        # 分片模式下 shard job 已上传各片 valid.json
        if: fromJSON(needs.plan.outputs.count) > 1
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards

      - name: 合并分片结果
        # --expected 必须等于实际片数：少一片就失败退出，
        # 绝不静默交付少 1/N 的产物（见 scripts/merge_shard_urls.py 顶部说明）
        if: fromJSON(needs.plan.outputs.count) > 1
        run: |
          python scripts/merge_shard_urls.py shards/*/valid.json \
            --out output/merged_valid.json \
            --expected ${{ needs.plan.outputs.count }}

      - name: 抓取数据
        id: fetch
        run: |
          # 分片模式下消费 shard 的结果，本 job 只做「过滤 → 分组 → 生成」；
          # 不分片模式（shard_count=1）退回单 job 内完整验证。
          EXTRA=""
          if [ -f output/merged_valid.json ]; then
            EXTRA="--valid-urls-file output/merged_valid.json"
            echo "::notice::分片模式：跳过本 job 内验证，使用合并后的 URL 集合"
          fi
          echo "::group::抓取阶段"
          python -u -m src.main \
            --no-cache \
            --fetch-timeout ${{ env.FETCH_TIMEOUT }} \
            --validate-concurrency ${{ env.VALIDATE_CONCURRENCY }} \
            --validate-timeout ${{ env.VALIDATE_TIMEOUT }} \
            $EXTRA \
            --output ./output
          echo "::endgroup::"

      - name: 产物体检（保险丝）
        # 频道总数 < 3000 或港澳台为 0 时非零退出，让 CI 变红而不是静默提交空产物
        run: python scripts/check_output.py output/stats.json

      # -----------------------------------------------------------------------
      # 可播性门禁（本轮新增）
      #
      # 防的是什么：check_output.py 只做**结构**体检（条数 / 分组 / 头部一致），
      # 一份「结构全对但每条都是死链」的产物能一路绿灯提交推送上主干，订阅者
      # 第二天拿到的是 33 条全死的播放列表，而 CI 是绿的。
      #
      # 口径：直接跑 scripts/check_streams.py，它复用 src/validator.py 的判定
      # （代理域名拒绝 / CDN 白名单 / HEAD 优先，失败退 GET），与流水线同源。
      #
      # 为什么**全跑不抽样**：hk_merged.m3u 实测只有 22~34 条（最近 60 天逐日
      # `grep -c '^#EXTINF'` 的区间；该文件在 git 历史里共 183 个提交，最近 12 天
      # 都是 30~33），jobs=20 一轮 3.8~13.3 秒（8 个历史产物实测，见下表）。
      # 抽样在这个规模上没有收益，只会让「33 条里死了 20 条」这种退化在抽样时被漏掉。
      #
      # 阈值怎么定的（真跑出来的，不是拍脑袋；复现命令见 PR 描述）：
      #   把 8 个历史日期的真实产物（2026-08-30 ~ 10-29）逐份跑一遍本脚本，
      #   拿到不可用占比分布（每份 = 当天的 output/hk_merged.m3u）：
      #     产物(日期)   条数  可用  不可用占比  单轮耗时
      #     f75575a(10-28)  33   33     0.0%      3.8s
      #     074c677(10-29)  33   32     3.0%      4.7s
      #     a6c7d3e(10-10)  23   21     8.7%     12.0s
      #     53a419a(10-20)  32   27    15.6%     12.1s
      #     900ed56(10-17)  32   22    31.2%     12.0s
      #     44c3837(09-19)  25   17    32.0%      7.0s
      #     a237746(08-30)  33   21    36.4%     13.3s
      #     eb315ef(09-05)  33   20    39.4%      9.6s  ← 最差
      #   中位数 23.4%，最差 39.4%（eb315ef，33 条里 13 条不可用）。
      #   阈值的上下界也钉在 tests/test_ci_workflow.py 里（> 0.394 且 <= 0.60），
      #   改阈值会让那个测试跟着红 —— 免得下一个人凭手感把门禁调成永远绿。
      #   取 MAX_BAD_RATIO = 0.50：
      #     · 比实测最差日（39.4%）高 10.6 个百分点 ≈ 33 条里的 3.5 条，留给
      #       「某条链路今天抽风」的抖动；单条抖动在 33 条规模上就等于 3 个百分点。
      #     · 0.40 会在实测最差日当天变红（39.4% > 40% 只差 0.6pp），0.35 会红在
      #       2/8 的历史日 —— 那样的门禁等于随机失败，最后一定被人关掉。
      #     · 0.50 仍然抓得住历史退化：docs/source-discovery.md 记录过手动拼装
      #       122/143/167 条产物时可用率只有 44.8%~48.4%（不可用 51.6%~55.2%），
      #       以及「只做去重」那次 167 条里只剩 53 条可播（不可用 68.3%）——
      #       这三种退化在 0.50 下**全部变红**。
      #
      # 抖动 vs 真退化：两轮独立探测，任一轮达标即通过。两轮都超阈值才判红 ——
      # 单轮网络抖动（DNS 抽风、某台 restream 短暂 5xx）不该让当天的产物停更，
      # 但系统性退化会让两轮同时红。这不是「永远绿」：判定依据是退出码
      # （--max-bad-ratio），只要两轮都真的超过 50% 不可用，步骤必定失败。
      #
      # 成本：单轮 3.8~13.3 秒（33 条 / jobs=20 / timeout=10s，8 个历史产物实测），
      # 最坏 2 轮 ≈ 13.3×2 + 5s 间隔 ≈ 32 秒，相对 update job 33.4 分钟的实测流水线
      # 是 1.6% 量级；step timeout 5 分钟足够。
      # -----------------------------------------------------------------------
      - name: 可播性门禁（hk_merged 实测可播率）
        id: playable
        timeout-minutes: 5
        env:
          MAX_BAD_RATIO: "0.50"
          WARN_BAD_RATIO: "0.35"
        run: |
          set -u
          WORK="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hk-streams"
          mkdir -p "$WORK"
          pass=0
          for attempt in 1 2; do
            echo "::group::可播性探测 第 ${attempt}/2 轮（阈值 不可用 <= ${MAX_BAD_RATIO}）"
            if python scripts/check_streams.py output/hk_merged.m3u \
                 --jobs 20 --timeout 10 --quiet \
                 --json "$WORK/hk-$attempt.json" \
                 --max-bad-ratio "$MAX_BAD_RATIO"; then
              pass=1
            fi
            echo "::endgroup::"
            if [ "$pass" -eq 1 ]; then break; fi
            echo "::warning::第 ${attempt} 轮超出阈值，5 秒后重测（区分单轮抖动与真退化）"
            sleep 5
          done

          python - "$WORK" "$WARN_BAD_RATIO" <<'PY'
          import json, pathlib, sys

          work, warn = pathlib.Path(sys.argv[1]), float(sys.argv[2])

          # 白名单域名：src/validator.py 的 _validate_one 命中这些就**直接 return True，
          # 一个请求都不发**。所以「可用率 100%」里可能有一批是定义上必然通过的，
          # 不是测出来的 —— 必须在 CI 日志里显式报出来，否则门禁的绿灯会骗人。
          wl_file = pathlib.Path("config/whitelist.txt")
          whitelist = []
          if wl_file.is_file():
              whitelist = [
                  line.strip() for line in
                  wl_file.read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.startswith("#")
              ]

          ratios = []
          for f in sorted(work.glob("hk-*.json")):
              d = json.loads(f.read_text(encoding="utf-8"))
              ratio = d["bad"] / d["total"]
              ratios.append(ratio)
              print(f"{f.name}: 可用 {d['ok']}/{d['total']}  不可用 {ratio:.1%}")
              for r in d["results"]:
                  if not r["ok"]:
                      print(f"    FAIL [{r['group']}] {r['name']} {r['url'][:72]}")

              exempt = [r for r in d["results"]
                        if any(w in r["url"].lower() for w in whitelist)]
              if exempt:
                  pct = len(exempt) / d["total"] * 100
                  print(f"::warning::{f.name}: {len(exempt)}/{d['total']} 条"
                        f"（{pct:.1f}%）命中 CDN 白名单，**未发任何请求**就判为可用。"
                        f"这些条目的真实可播性本门禁看不到，"
                        f"真实可用率可能低于上面的数字。")
                  for r in exempt:
                      print(f"    EXEMPT(未探测) [{r['group']}] {r['name']} {r['url'][:64]}")

          # 只对「最好的一轮」告警：抖动轮已经红过一次，不必再报漂移
          if ratios and min(ratios) > warn:
              print(f"::warning::最好一轮的不可用占比仍有 {min(ratios):.1%}，"
                    f"超过预警线 {warn:.0%}（硬阈值 50%），可播性在漂移")
          PY

          if [ "$pass" -ne 1 ]; then
            echo "::error::两轮探测的不可用占比都超过 ${MAX_BAD_RATIO}，拒绝提交死链产物"
            exit 1
          fi

      # -----------------------------------------------------------------------
      # 白名单盲区补测（2026-10-30 全流程实测发现，本轮新增）
      #
      # 为什么需要单独一步：src/validator.py 的 `_validate_one()` 对
      # config/whitelist.txt 命中的域名**直接 return True，一个请求都不发**。
      # check_streams.py 复用的正是这个口径，所以上面那一步看到的「可用率」
      # 里有一批是**定义上必然通过**的，不是测出来的。
      #
      # 实测证据（2026-10-30 本机全流程，hk_merged 81 条）：
      #   门禁口径      81/81 可用 = 100.0%
      #   真实探测      67/81 可用 =  82.7%   ← 虚高 17.3 个百分点
      #   15 条命中白名单（cloudfront.net / githubusercontent.com），逐条真发请求：
      #     · 1 条真可用（cloudfront application/x-mpegURL）
      #     · 7 条 HTTP 403 + text/html（CloudFront 已封）
      #     · 7 条 HTTP 200 但内容是指向 youtube.com 的伪直播 m3u8
      #   也就是说：白名单恰好放过了这个产物里**全部 14 条死链**。
      #
      # 这一步绕过白名单，对这些条目真发请求，把补测出的死链计入总不可用占比，
      # 用同一个 MAX_BAD_RATIO 判定。它不替换上一步（上一步仍是主判据，
      # 且带两轮重试吸收抖动），而是把上一步看不见的那部分补齐。
      #
      # 判定口径（宁严不宽）：
      #   · HTTP 2xx 且 Content-Type 属于 HLS/视频/octet-stream/空 → 活
      #   · 内容里出现 youtube.com / youtu.be → 伪直播，算死（IPTV 播放器放不出来）
      #   · 其余（403 / HTML / 其他类型）→ 死
      # -----------------------------------------------------------------------
      - name: 可播性门禁（白名单盲区补测）
        id: playable_exempt
        timeout-minutes: 5
        env:
          MAX_BAD_RATIO: "0.50"
        run: |
          set -u
          WORK="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hk-streams"
          python - "$WORK" "$MAX_BAD_RATIO" <<'PY'
          import asyncio, json, pathlib, sys

          work = pathlib.Path(sys.argv[1])
          max_bad = float(sys.argv[2])
          files = sorted(work.glob("hk-*.json"))
          if not files:
              print("::error::找不到门禁的逐条结果，白名单补测无从下手")
              raise SystemExit(1)

          import aiohttp

          data = json.loads(files[0].read_text(encoding="utf-8"))
          wl_file = pathlib.Path("config/whitelist.txt")
          whitelist = []
          if wl_file.is_file():
              whitelist = [
                  ln.strip() for ln in
                  wl_file.read_text(encoding="utf-8").splitlines()
                  if ln.strip() and not ln.startswith("#")
              ]

          exempt = [r for r in data["results"]
                    if any(w in r["url"].lower() for w in whitelist)]
          if not exempt:
              print("✅ 无白名单免探测条目，主门禁的可用率就是真实可用率")
              raise SystemExit(0)

          VALID_CT = ("video", "audio", "application/octet-stream",
                      "application/x-mpegurl", "application/vnd.apple.mpegurl")

          async def probe(session, rec):
              try:
                  async with session.get(
                      rec["url"], allow_redirects=True,
                      timeout=aiohttp.ClientTimeout(total=15),
                  ) as r:
                      body = (await r.content.read(400)).decode("utf-8", "replace")
                      ct = (r.headers.get("Content-Type") or "").lower()
                      status = r.status
              except Exception as exc:
                  return rec, False, f"{type(exc).__name__}: {exc}"
              if not (200 <= status < 300):
                  return rec, False, f"HTTP {status}"
              if "youtube.com" in body or "youtu.be" in body:
                  return rec, False, "内容指向 youtube（伪直播）"
              if ct and not any(v in ct for v in VALID_CT):
                  return rec, False, f"Content-Type 不可播: {ct}"
              if "#EXTM3U" not in body and "m3u8" not in rec["url"].lower():
                  return rec, False, "内容不是播放列表"
              return rec, True, ""

          async def main():
              async with aiohttp.ClientSession() as s:
                  return await asyncio.gather(*(probe(s, r) for r in exempt))

          results = asyncio.run(main())
          dead = [(r, why) for r, ok, why in results if not ok]

          print(f"白名单免探测 {len(exempt)} 条 → 真实补测："
                f"活 {len(exempt) - len(dead)} / 死 {len(dead)}")
          for rec, why in dead:
              print(f"    DEAD [{rec['group']}] {rec['name']} "
                    f"{rec['url'][:64]} —— {why}")

          # 主门禁的 bad 数 + 补测出的死链 = 真实不可用总数
          base_total = data["total"]
          base_bad = data["bad"]
          true_bad = base_bad + len(dead)
          ratio = true_bad / base_total
          print(f"\n门禁口径: 不可用 {base_bad}/{base_total} = {base_bad / base_total:.1%}")
          print(f"真实口径: 不可用 {true_bad}/{base_total} = {ratio:.1%}"
                f"（补测补出 {len(dead)} 条）")
          if ratio > max_bad:
              print(f"::error::补齐白名单盲区后不可用占比 {ratio:.1%} "
                    f"超过阈值 {max_bad:.1%}")
              raise SystemExit(1)
          if dead:
              print(f"::warning::门禁绿灯但真实不可用占比 {ratio:.1%}，"
                    f"其中 {len(dead)} 条是白名单免探测的死链（建议清 whitelist.txt）")
          print(f"✅ 补齐盲区后不可用占比 {ratio:.1%} <= {max_bad:.1%}")
          PY

      - name: 检查是否有更新
        id: changes
        run: |
          if [ -n "$(git status --porcelain output/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 output/ 有变化，将提交"
            git status --porcelain output/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "📭 output/ 无变化，跳过提交"
          fi

      - name: 提交并推送
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          COMMIT_MSG="Update IPTV $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git commit -m "$COMMIT_MSG"

          # ------------------------------------------------------------------
          # 并发保护：先把远端 main 合进来，再 push。
          #
          # 为什么必须有：这个 job 从 checkout 到 push 之间要跑 ~20 分钟，
          # 这段时间里 main 完全可能被推动（人工提交 / 上一轮迟到的推送 /
          # workflow_dispatch 与 schedule 撞车）。此时直接 push 会被
          # non-fast-forward 拒绝，结果是「今天的产物没上去，job 变红」——
          # 对这个项目的用户来说就是当天没有新播放列表。
          #
          # 这不是假想：2026-10-30 本地全流程验证时真实复现过，报错
          #   ! [rejected] HEAD -> main (non-fast-forward)
          #
          # `-X ours`：output/ 是生成物，冲突时**以本次运行为准**（本次最新、
          # 且刚过了保险丝与可播性门禁）。不用 rebase —— rebase 会把本次提交
          # 重放到别人的历史上，一旦冲突要人工 abort，脚本里更难写对。
          # ------------------------------------------------------------------
          git fetch origin main
          if ! git merge --no-edit -X ours origin/main; then
            echo "::error::合并远端 main 失败，放弃推送（产物已在本 run 的 artifact 里）"
            exit 1
          fi

          git push origin HEAD:main
          echo "✅ 已推送: $COMMIT_MSG"

      - name: 上传产物（保留7天）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iptv-output-${{ github.run_number }}
          path: output/
          retention-days: 7
