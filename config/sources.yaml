# IPTV 数据源配置
# priority: 1=最高优先, 2=高优先, 3=中优先, 4=一般, 5=补充, 6=低优先
#
# 格式支持（见 src/fetcher.py，按**内容**嗅探，不看后缀）：
#   - m3u / m3u8 文本（含 #EXTINF）
#   - markdown 表格（Free-TV 那种 `| # | Channel | [>](url) |`）
#   - YAML（Free-IPTV 的 streams: 结构）
#
# 2026-10-29 逐源体检结果与改动（详见 docs/source-health.md）：
#   - sammy0101 / xiweiwong：原用 raw.gh.registry.cyou 代理，该代理已死（http=000）。
#     改直连 raw.githubusercontent.com 后实测 32 / 252 条。
#   - freetv-fun：t.freetv.fun 与 freetv.fun 均 20s 超时（http=000），停用。
#   - Harbin-byte-iptv：内容与 free-tv-hk 逐字节相同（md5 一致），是 Free-TV 的旧 fork，停用。
#   - 8 个 .md 源（Free-TV 各区域 + 上面那个 fork）此前全部解析 0 条，因为旧代码把非 .yml
#     一律当 m3u；补上 markdown 表格解析后实测合计 164 条。

sources:
  # === 最高优先：香港本地源 ===
